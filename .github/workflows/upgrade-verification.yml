name: Upgrade Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'helm/**'
      - 'tests/e2e/**'
      - 'Dockerfile'
      - '.github/workflows/upgrade-verification.yml'

permissions:
  contents: read

jobs:
  upgrade-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e .

      - name: Install kind
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
          version: v0.33.0

      - name: Build release images
        run: ./scripts/build-releases.sh

      - name: Create cluster and load releases
        run: ./scripts/kind-up.sh

      - name: Verify fresh install and GA upgrade path
        run: |
          mkdir -p reports
          pytest -m e2e -v tests/e2e --junitxml=reports/upgrade-verification.xml

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-verification-evidence
          path: reports/upgrade-verification.xml
