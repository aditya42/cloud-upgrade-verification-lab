apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cloud-upgrade-lab.name" . }}-postgres
spec:
  serviceName: {{ include "cloud-upgrade-lab.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cloud-upgrade-lab.name" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "cloud-upgrade-lab.name" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.username }} -d {{ .Values.postgres.database }}"]
            initialDelaySeconds: 3
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
